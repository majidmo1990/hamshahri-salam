name: hamshahri_salam
description: "اپلیکیشن ثبت و مشاهده ملک همشهری سلام"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  share_plus: ^10.1.0
  url_launcher: ^6.3.1
  shamsi_date: ^1.1.0
  persian_datetime_picker: ^3.0.1
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  carousel_slider: ^5.0.0
  image_picker: ^1.1.2
  video_player: ^2.9.2
  smooth_page_indicator: ^1.2.0
  dio: ^5.7.0
  dio_smart_retry: ^7.0.0
  flutter_image_compress: ^2.3.0
  shared_preferences: ^2.3.3
  path: ^1.9.0
  mime: ^1.0.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/slider1.jpg
    - assets/images/slider2.jpg
    - assets/images/slider3.jpg
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Light.ttf
          weight: 300
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0D0D0D"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
